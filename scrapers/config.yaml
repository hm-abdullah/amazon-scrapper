# ----- Search Targets ----------------------------------------
search_urls:
  - "https://www.amazon.com/s?k=gaming+headset"
  - "https://www.amazon.com/s?k=gaming+mouse"
  - "https://www.amazon.com/s?k=gaming+keyboard"
  - "https://www.amazon.com/s?k=gaming+monitor"

max_pages: 1

max_products: 50

concurrency: 2

download_delay: 3.0

timeout_seconds: 90

retry_count: 2

output_dir: "output"

proxies: []
# Example:
#   - "http://user1:pass1@residential1.proxy.com:8080"


proxy_max_consecutive_failures: 3   
proxy_cooldown_seconds: 300         

ai_extraction:
  enabled: false
  provider: "gemini"
  api_key: ""
  model: "gemini-3.1-flash-lite"
  max_products: 10
